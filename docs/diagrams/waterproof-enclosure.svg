<svg viewBox="0 0 1000 480" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace,Menlo,Consolas,monospace">
  <defs>
    <pattern id="grid4" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#ffffff10" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1000" height="480" fill="#0d0d12"/>
  <rect width="1000" height="480" fill="url(#grid4)"/>

  <text x="24" y="34" fill="#e6e6e6" font-size="20" font-weight="600">Security-Doorbell-Cam — Weatherproof Mount (cross-section)</text>
  <text x="24" y="54" fill="#94a3b8" font-size="12">IP65+ enclosure, camera behind a clear sealed window, PIR lens exposed but gasketed</text>

  <rect x="150" y="90" width="440" height="330" rx="14" fill="#14141c" stroke="#38bdf8" stroke-width="2.5"/>
  <text x="370" y="118" fill="#38bdf8" font-size="13" text-anchor="middle" font-weight="600">Weatherproof doorbell housing</text>

  <!-- camera window -->
  <rect x="180" y="150" width="120" height="90" rx="6" fill="#0d0d12" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="240" y="182" fill="#e6e6e6" font-size="10" text-anchor="middle">Camera</text>
  <rect x="290" y="160" width="18" height="70" fill="#0d0d12" stroke="#4ade80" stroke-width="2"/>
  <text x="330" y="180" fill="#4ade80" font-size="10" font-weight="600">clear acrylic</text>
  <text x="330" y="194" fill="#4ade80" font-size="10" font-weight="600">window, gasket-sealed</text>
  <text x="330" y="210" fill="#94a3b8" font-size="9">(no glare coating —</text>
  <text x="330" y="222" fill="#94a3b8" font-size="9">test for IR reflection at night)</text>

  <!-- PIR lens -->
  <rect x="180" y="255" width="120" height="60" rx="6" fill="#0d0d12" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="240" y="280" fill="#e6e6e6" font-size="10" text-anchor="middle">PIR sensor</text>
  <circle cx="300" cy="285" r="10" fill="none" stroke="#a78bfa" stroke-width="2"/>
  <text x="330" y="275" fill="#a78bfa" font-size="10" font-weight="600">fresnel lens dome</text>
  <text x="330" y="289" fill="#94a3b8" font-size="9">exposed but gasket-ringed</text>
  <text x="330" y="303" fill="#94a3b8" font-size="9">— needs IR line-of-sight, can't</text>
  <text x="330" y="317" fill="#94a3b8" font-size="9">go behind acrylic like the camera</text>

  <!-- Pi board -->
  <rect x="180" y="335" width="200" height="60" rx="6" fill="#0d0d12" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="280" y="369" fill="#e6e6e6" font-size="10" text-anchor="middle">Pi board + speaker/mic</text>

  <!-- speaker vent -->
  <rect x="410" y="335" width="150" height="60" rx="6" fill="#0d0d12" stroke="#4ade80" stroke-width="1.5"/>
  <text x="485" y="359" fill="#e6e6e6" font-size="10" text-anchor="middle">Speaker/mic ports</text>
  <text x="485" y="374" fill="#4ade80" font-size="9" text-anchor="middle" font-weight="600">acoustic-vent membrane</text>
  <text x="485" y="388" fill="#94a3b8" font-size="8" text-anchor="middle">same pattern as Walkie-Talkie-Build</text>

  <!-- cable glands -->
  <g stroke="#f97316" stroke-width="2" fill="none">
    <rect x="220" y="420" width="26" height="26" rx="4"/>
    <rect x="480" y="420" width="26" height="26" rx="4"/>
  </g>
  <text x="233" y="466" fill="#94a3b8" font-size="9" text-anchor="middle">power / solar</text>
  <text x="493" y="466" fill="#94a3b8" font-size="9" text-anchor="middle">ethernet (if wired)</text>
  <line x1="233" y1="420" x2="233" y2="395" stroke="#f97316" stroke-width="2"/>
  <line x1="493" y1="420" x2="493" y2="395" stroke="#f97316" stroke-width="2"/>

  <!-- Solar panel outside -->
  <rect x="680" y="130" width="180" height="90" rx="6" fill="#14141c" stroke="#eab308" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="770" y="160" fill="#e6e6e6" font-size="12" text-anchor="middle" font-weight="600">Solar panel</text>
  <text x="770" y="176" fill="#94a3b8" font-size="9" text-anchor="middle">separate small housing,</text>
  <text x="770" y="190" fill="#94a3b8" font-size="9" text-anchor="middle">angled for sky view near the door</text>
  <line x1="680" y1="175" x2="640" y2="175" stroke="#eab308" stroke-width="2"/>
  <line x1="640" y1="175" x2="640" y2="433" stroke="#eab308" stroke-width="2"/>
  <line x1="640" y1="433" x2="506" y2="433" stroke="#eab308" stroke-width="2"/>

  <g font-size="10" fill="#94a3b8">
    <text x="680" y="250" fill="#e6e6e6" font-weight="600">Doorbell-specific gotchas</text>
    <text x="680" y="270">• Camera window must be truly clear —</text>
    <text x="690" y="284">any coating/tint kills night IR</text>
    <text x="680" y="304">• PIR needs an actual lens dome exposed</text>
    <text x="690" y="318">to the outside, unlike the camera</text>
    <text x="680" y="338">• Mount under an eave/overhang if at</text>
    <text x="690" y="352">all possible — reduces direct rain load</text>
    <text x="680" y="372">• Solar panel usually needs its own small</text>
    <text x="690" y="386">housing, separate from the doorbell body</text>
  </g>
</svg>
