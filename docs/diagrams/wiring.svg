<svg viewBox="0 0 960 620" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace,Menlo,Consolas,monospace">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#ffffff10" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="960" height="620" fill="#0d0d12"/>
  <rect width="960" height="620" fill="url(#grid)"/>

  <text x="24" y="34" fill="#e6e6e6" font-size="20" font-weight="600">Security-Doorbell-Cam — Wiring</text>
  <text x="24" y="54" fill="#94a3b8" font-size="12">Core build (Pi + camera + PIR + audio) + optional solar variant, dashed</text>

  <!-- Pi board -->
  <rect x="300" y="140" width="220" height="260" rx="8" fill="#14141c" stroke="#38bdf8" stroke-width="2"/>
  <text x="410" y="166" fill="#e6e6e6" font-size="14" text-anchor="middle" font-weight="600">Pi Zero 2 W</text>
  <text x="410" y="182" fill="#94a3b8" font-size="10" text-anchor="middle">or Pi 4/5 for real-time streaming</text>

  <g font-size="10" fill="#94a3b8">
    <text x="312" y="210">CSI (camera ribbon)</text>
    <text x="312" y="230">GPIO17 (PIR)</text>
    <text x="312" y="250">GPIO18 (speaker I2S)</text>
    <text x="312" y="270">USB (mic, or I2S mic)</text>
    <text x="312" y="290">5V USB-C power in</text>
  </g>
  <circle cx="300" cy="206" r="3" fill="#38bdf8"/>
  <circle cx="300" cy="226" r="3" fill="#a78bfa"/>
  <circle cx="300" cy="246" r="3" fill="#4ade80"/>
  <circle cx="300" cy="266" r="3" fill="#4ade80"/>
  <circle cx="300" cy="286" r="3" fill="#f97316"/>

  <!-- Camera module -->
  <rect x="620" y="140" width="180" height="80" rx="6" fill="#14141c" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="710" y="166" fill="#e6e6e6" font-size="12" text-anchor="middle" font-weight="600">Pi Camera Module</text>
  <text x="710" y="182" fill="#94a3b8" font-size="9" text-anchor="middle">wide-lens variant for doorbell FOV</text>
  <text x="710" y="200" fill="#94a3b8" font-size="9" text-anchor="middle">official module = better driver support</text>
  <polyline points="520,206 600,206 600,180 620,180" fill="none" stroke="#38bdf8" stroke-width="2"/>

  <!-- PIR sensor -->
  <rect x="620" y="240" width="180" height="70" rx="6" fill="#14141c" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="710" y="264" fill="#e6e6e6" font-size="12" text-anchor="middle" font-weight="600">PIR motion sensor</text>
  <text x="710" y="280" fill="#94a3b8" font-size="9" text-anchor="middle">adjustable sensitivity + delay pots</text>
  <text x="710" y="296" fill="#94a3b8" font-size="9" text-anchor="middle">tune these — defaults over-trigger</text>
  <polyline points="520,226 600,226 600,270 620,270" fill="none" stroke="#a78bfa" stroke-width="2"/>

  <!-- Speaker/mic -->
  <rect x="620" y="330" width="85" height="70" rx="6" fill="#14141c" stroke="#4ade80" stroke-width="1.5"/>
  <text x="662" y="354" fill="#e6e6e6" font-size="10" text-anchor="middle">Speaker</text>
  <text x="662" y="368" fill="#94a3b8" font-size="8" text-anchor="middle">2-way audio</text>
  <polyline points="520,246 590,246 590,365 620,365" fill="none" stroke="#4ade80" stroke-width="2"/>

  <rect x="715" y="330" width="85" height="70" rx="6" fill="#14141c" stroke="#4ade80" stroke-width="1.5"/>
  <text x="757" y="354" fill="#e6e6e6" font-size="10" text-anchor="middle">Mic</text>
  <text x="757" y="368" fill="#94a3b8" font-size="8" text-anchor="middle">electret</text>
  <polyline points="520,266 605,266 605,365 715,365" fill="none" stroke="#4ade80" stroke-width="2"/>

  <!-- ===== SOLAR VARIANT ===== -->
  <g stroke="#eab308" stroke-width="1.5" fill="none" stroke-dasharray="5 4">
    <rect x="30" y="90" width="230" height="480" rx="10"/>
  </g>
  <text x="42" y="112" fill="#eab308" font-size="12" font-weight="600">SOLAR VARIANT (optional)</text>

  <rect x="54" y="132" width="182" height="90" rx="6" fill="#14141c" stroke="#eab308" stroke-width="1.5"/>
  <text x="145" y="160" fill="#e6e6e6" font-size="12" text-anchor="middle" font-weight="600">Solar panel</text>
  <text x="145" y="178" fill="#94a3b8" font-size="9" text-anchor="middle">5–10W, mounted with clear</text>
  <text x="145" y="192" fill="#94a3b8" font-size="9" text-anchor="middle">sky view near the door</text>

  <line x1="145" y1="222" x2="145" y2="260" stroke="#eab308" stroke-width="2"/>

  <rect x="54" y="260" width="182" height="90" rx="6" fill="#14141c" stroke="#eab308" stroke-width="1.5"/>
  <text x="145" y="288" fill="#e6e6e6" font-size="12" text-anchor="middle" font-weight="600">Charge controller</text>
  <text x="145" y="304" fill="#94a3b8" font-size="9" text-anchor="middle">low-voltage cutoff</text>
  <text x="145" y="320" fill="#94a3b8" font-size="9" text-anchor="middle">size battery for the Pi's</text>
  <text x="145" y="334" fill="#94a3b8" font-size="9" text-anchor="middle">*continuous* draw, not idle</text>

  <line x1="145" y1="350" x2="145" y2="390" stroke="#f97316" stroke-width="2"/>

  <rect x="54" y="390" width="182" height="80" rx="6" fill="#14141c" stroke="#eab308" stroke-width="1.5"/>
  <text x="145" y="418" fill="#e6e6e6" font-size="12" text-anchor="middle" font-weight="600">Battery pack</text>
  <text x="145" y="434" fill="#94a3b8" font-size="9" text-anchor="middle">sized for cloudy-week runtime</text>
  <text x="145" y="448" fill="#94a3b8" font-size="9" text-anchor="middle">at the Pi's real draw</text>

  <line x1="236" y1="430" x2="300" y2="286" stroke="#f97316" stroke-width="2"/>
  <text x="240" y="400" fill="#f97316" font-size="9">→ 5V USB-C</text>

  <!-- Legend -->
  <g font-size="10" fill="#94a3b8">
    <text x="620" y="450" fill="#e6e6e6" font-weight="600">Legend</text>
    <line x1="620" y1="462" x2="644" y2="462" stroke="#f97316" stroke-width="2"/><text x="650" y="466">Power</text>
    <line x1="620" y1="478" x2="644" y2="478" stroke="#38bdf8" stroke-width="2"/><text x="650" y="482">Camera/data</text>
    <line x1="620" y1="494" x2="644" y2="494" stroke="#a78bfa" stroke-width="2"/><text x="650" y="498">Digital I/O (PIR)</text>
    <line x1="620" y1="510" x2="644" y2="510" stroke="#4ade80" stroke-width="2"/><text x="650" y="514">Audio</text>
    <line x1="620" y1="526" x2="644" y2="526" stroke="#eab308" stroke-width="2" stroke-dasharray="4 3"/><text x="650" y="530">Solar variant only</text>
  </g>

  <text x="620" y="560" fill="#94a3b8" font-size="10">⚠ Real-time streaming (Pi 4/5) draws far more</text>
  <text x="632" y="574" fill="#94a3b8" font-size="10">continuous power than snapshot-only (Zero 2 W) —</text>
  <text x="632" y="588" fill="#94a3b8" font-size="10">solar sizing differs a lot between the two.</text>
</svg>
